[workspace]
resolver = "2"
members = ["crates/optic-core", "crates/optic-io", "crates/optic-wasm"]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Measured, not guessed: `cargo check --workspace --all-features` passes on 1.78 and the
# CI job re-checks it on every push. The binding constraint is Cargo.lock's v4 format,
# which older toolchains cannot parse; the code itself and every dependency need less.
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/BenoitJeanson/optic"
authors = ["Benoit Jeanson", "Elias"]

[workspace.dependencies]
optic-core = { path = "crates/optic-core", version = "0.0.1" }
optic-io = { path = "crates/optic-io", version = "0.0.1" }
serde = { version = "1", features = ["derive"] }
approx = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
