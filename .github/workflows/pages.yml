name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Compiles the kernel to WebAssembly and stages it in web/, which is both what
      # the smoke test loads and what gets published.
      - name: Build the page
        run: ./scripts/build-web.sh

      # The demo is the app, so it does not ship unless it actually runs.
      - name: Smoke test
        working-directory: tests/web
        run: |
          npm install --no-audit --no-fund
          node smoke.mjs

      - name: Assemble the site
        run: |
          mkdir -p site
          cp web/index.html web/style.css web/*.js web/optic_wasm.wasm site/
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
